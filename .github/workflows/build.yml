name: Build release artifact

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET 7
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 7.0.x

      - name: Build portable Windows release
        shell: pwsh
        run: .\scripts\build-release.ps1

      - name: Upload unsigned artifact for review and signing
        uses: actions/upload-artifact@v4
        with:
          name: GuguPet-Windows-x64-unsigned
          path: |
            artifacts/GuguPet-Windows-x64.zip
            artifacts/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
